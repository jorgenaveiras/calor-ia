  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #000; --card: #1c1c1e; --text: #fff; --text2: #8e8e93;
      --accent: #30d158; --accent-dim: rgba(48,209,88,0.15);
      --blue: #5e9eff; --yellow: #ffd60a; --orange: #ff9f0a; --red: #ff453a;
      --sep: rgba(255,255,255,0.08);
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

    /* ===== SCREENS ===== */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform 0.35s cubic-bezier(0.32,0.72,0,1); }
    .screen.hidden { transform: translateX(100%); pointer-events: none; }
    .screen.hidden-left { transform: translateX(-100%); pointer-events: none; }

    /* ===== HEADER ===== */
    .hdr { padding: calc(var(--safe-top) + 8px) 20px 12px; text-align: center; flex-shrink: 0; }
    .hdr h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .hdr h1 span { color: var(--accent); }
    .hdr p { font-size: 13px; color: var(--text2); margin-top: 2px; }

    /* ===== CAMERA SCREEN ===== */
    .cam-wrap { flex: 1; margin: 0 14px; border-radius: 22px; overflow: hidden; background: var(--card); display: flex; align-items: center; justify-content: center; position: relative; }
    #video { width: 100%; height: 100%; object-fit: cover; border-radius: 22px; display: none; }
    #canvas { display: none; }
    .ph { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text2); }
    .ph svg { width: 44px; height: 44px; opacity: 0.35; }
    .ph span { font-size: 14px; font-weight: 500; }
    .xhair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 180px; height: 180px; pointer-events: none; z-index: 5; opacity: 0.4; transition: opacity 0.3s; }
    .xhair.off { opacity: 0; }
    .xhair::before, .xhair::after { content:''; position: absolute; background: rgba(255,255,255,0.5); border-radius: 2px; }
    .xhair::before { width: 1px; height: 100%; left: 50%; }
    .xhair::after { width: 100%; height: 1px; top: 50%; }

    .ctrls { padding: 16px 16px calc(var(--safe-bottom) + 14px); display: flex; align-items: center; justify-content: center; gap: 28px; flex-shrink: 0; }
    .cam-btn { width: 68px; height: 68px; border-radius: 50%; border: 4px solid #fff; background: transparent; cursor: pointer; position: relative; flex-shrink: 0; transition: all 0.15s; }
    .cam-btn::after { content:''; position: absolute; inset: 4px; border-radius: 50%; background: #fff; transition: all 0.15s; }
    .cam-btn:active { transform: scale(0.92); }
    .cam-btn:active::after { background: #bbb; }
    .sm-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--card); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
    .sm-btn:active { transform: scale(0.9); }
    .sm-btn svg { width: 20px; height: 20px; }

    /* Today badge */
    .badge { position: absolute; top: 0; right: 14px; background: var(--card); border-radius: 14px; padding: 6px 12px; display: flex; align-items: center; gap: 5px; z-index: 10; font-size: 12px; font-weight: 600; color: var(--accent); }

    /* ===== FOOD PICKER SCREEN ===== */
    .pick-wrap { flex: 1; overflow-y: auto; padding: 0 14px 20px; -webkit-overflow-scrolling: touch; }
    .photo-thumb { width: 100%; height: 160px; border-radius: 18px; object-fit: cover; background: var(--card); }
    .cat-label { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin: 18px 0 8px; }
    .food-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .food-card { background: var(--card); border-radius: 16px; padding: 12px 6px; text-align: center; cursor: pointer; transition: transform 0.12s, background 0.12s; border: 2px solid transparent; }
    .food-card:active { transform: scale(0.95); background: #2c2c2e; }
    .food-card .emoji { font-size: 28px; line-height: 1.2; }
    .food-card .fname { font-size: 12px; font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .food-card .fcal { font-size: 11px; color: var(--accent); font-weight: 500; margin-top: 2px; }

    /* Search bar */
    .search-bar { width: 100%; padding: 10px 14px; border-radius: 12px; border: none; background: var(--card); color: var(--text); font-size: 15px; font-family: inherit; margin-bottom: 4px; outline: none; }
    .search-bar::placeholder { color: var(--text2); }

    /* Back button */
    .back-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 15px; font-weight: 600; background: none; border: none; cursor: pointer; padding: 8px 0; margin-bottom: 4px; }
    .back-btn svg { width: 18px; height: 18px; }

    /* ===== DETAIL SCREEN ===== */
    .det-wrap { flex: 1; overflow-y: auto; padding: 0 20px 30px; -webkit-overflow-scrolling: touch; }
    .det-photo { width: 100%; height: 180px; border-radius: 18px; object-fit: cover; background: var(--card); margin-bottom: 16px; }
    .det-name { font-size: 24px; font-weight: 700; }
    .det-serving { font-size: 13px; color: var(--text2); margin-top: 2px; margin-bottom: 16px; }

    /* Serving adjuster */
    .srv-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; }
    .srv-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--sep); background: var(--card); color: var(--text); font-size: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
    .srv-btn:active { background: var(--accent); border-color: var(--accent); color: #000; }
    .srv-val { font-size: 22px; font-weight: 700; min-width: 50px; text-align: center; }
    .srv-label { font-size: 12px; color: var(--text2); text-align: center; }

    /* Macro cards */
    .macro-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .mc { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 14px 8px; text-align: center; }
    .mc .mv { font-size: 26px; font-weight: 700; }
    .mc .ml { font-size: 11px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .mc.c .mv { color: var(--accent); }
    .mc.p .mv { color: var(--blue); }
    .mc.cb .mv { color: var(--yellow); }

    /* Detail list */
    .det-list { list-style: none; margin-bottom: 20px; }
    .det-list li { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--sep); font-size: 14px; }
    .det-list li:last-child { border-bottom: none; }
    .det-list .dl { color: var(--text2); }

    /* Buttons */
    .btn-main { width: 100%; padding: 14px; border-radius: 14px; border: none; background: var(--accent); color: #000; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 4px; transition: opacity 0.12s; }
    .btn-main:active { opacity: 0.8; }
    .btn-sec { width: 100%; padding: 14px; border-radius: 14px; border: none; background: rgba(255,255,255,0.08); color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.12s; }
    .btn-sec:active { background: rgba(255,255,255,0.14); }

    /* ===== HISTORY SCREEN ===== */
    .hist-wrap { flex: 1; overflow-y: auto; padding: 0 20px 30px; -webkit-overflow-scrolling: touch; }
    .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--sep); }
    .hist-item:last-child { border-bottom: none; }
    .hist-item .hi-left .hi-name { font-weight: 600; font-size: 15px; }
    .hist-item .hi-left .hi-time { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .hist-item .hi-cal { font-size: 18px; font-weight: 700; color: var(--accent); }
    .hist-total { display: flex; justify-content: space-between; padding: 16px 0; border-top: 2px solid var(--sep); margin-top: 4px; }
    .hist-total .ht-label { font-size: 17px; font-weight: 600; }
    .hist-total .ht-val { font-size: 22px; font-weight: 700; color: var(--accent); }
    .empty { text-align: center; padding: 50px 0; color: var(--text2); }
    .empty svg { width: 36px; height: 36px; opacity: 0.25; margin-bottom: 10px; }

    .section-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  </style>
</head>

    { id:'galleta', emoji:'🍪', name:'Galleta', cat:'Snacks', cal:78, p:1, c:11, f:3.5, fb:0.5, serving:'1 galleta (14g)' },
    { id:'papas-fritas', emoji:'🍟', name:'Papas fritas', cat:'Snacks', cal:365, p:4, c:48, f:18, fb:4, serving:'1 porcion (117g)' },
    { id:'frijoles', emoji:'🫘', name:'Frijoles', cat:'Snacks', cal:227, p:15, c:41, f:0.9, fb:11.5, serving:'1 taza (172g)' },
    { id:'nueces', emoji:'🥜', name:'Nueces', cat:'Snacks', cal:185, p:4.3, c:3.9, f:18, fb:1.9, serving:'1/4 taza (28g)' },
  ];

  /* ===== CATEGORIES (ordered) ===== */
  const CATS = ['Proteinas','Carbos','Vegetales','Frutas','Lacteos','Comida rapida','Bebidas','Snacks'];

  /* ===== STATE ===== */
  let currentFood = null;
  let currentMult = 1;

  /* ===== NAV ===== */
  function show(screen) {
    [screenCam, screenPick, screenDet, screenHist].forEach(s => s.classList.add('hidden'));
    screen.classList.remove('hidden');
    screen.classList.remove('hidden-left');
  }

  /* ===== CAMERA ===== */
  async function initCam() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('getUserMedia no disponible');
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode, width:{ideal:1280}, height:{ideal:720} }, audio:false });
      video.srcObject = stream;
      video.style.display = 'block';
      ph.style.display = 'none';
      xhair.classList.remove('off');
    } catch(e) {
      ph.querySelector('span').textContent = 'Sin acceso a la camara';
      showErr('Camara: ' + (e.name||'bloqueada'));
    }
  }

  function snap() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    photoDataUrl = canvas.toDataURL('image/jpeg', 0.8);
    showPicker();
  }

  /* ===== FOOD PICKER ===== */
  function showPicker() {
    show(screenPick);
    renderFoodGrid('');
  }

  function renderFoodGrid(query) {
    const q = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    let html = '';
    if (photoDataUrl) html += '<img class="photo-thumb" src="' + photoDataUrl + '" alt="foto">';
    html += '<input class="search-bar" id="searchInput" type="search" placeholder="Buscar alimento..." value="' + query + '">';
    html += '<div style="height:12px"></div>';

    CATS.forEach(cat => {
      const foods = FOODS.filter(f => {
        if (f.cat !== cat) return false;
        if (!q) return true;
        return f.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q) || f.cat.toLowerCase().includes(q);
      });
      if (foods.length === 0) return;
      html += '<div class="cat-label">' + cat + '</div>';
      html += '<div class="food-grid">';
      foods.forEach(f => {
        html += '<div class="food-card" data-id="' + f.id + '">';
        html += '<div class="emoji">' + f.emoji + '</div>';
        html += '<div class="fname">' + f.name + '</div>';
        html += '<div class="fcal">' + f.cal + ' kcal</div>';
        html += '</div>';
      });
      html += '</div>';
    });

    pickWrap.innerHTML = html;

    // Search handler
    const input = $('searchInput');
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => renderFoodGrid(input.value), 200);
    });
    input.focus();

    // Food card handlers
    pickWrap.querySelectorAll('.food-card').forEach(card => {
      card.addEventListener('click', () => {
        const food = FOODS.find(f => f.id === card.dataset.id);
        if (food) showDetail(food);
      });
    });
  }

  /* ===== DETAIL ===== */
  function showDetail(food) {
    currentFood = food;
    currentMult = 1;
    show(screenDet);
    renderDetail();
  }

  function renderDetail() {
    const f = currentFood;
    const m = currentMult;
    const cal = Math.round(f.cal * m);
    const p = (f.p * m).toFixed(1);
    const c = (f.c * m).toFixed(1);
    const fat = (f.f * m).toFixed(1);
    const fb = (f.fb * m).toFixed(1);

    let html = '';
    if (photoDataUrl) html += '<img class="det-photo" src="' + photoDataUrl + '">';
    html += '<div class="det-name">' + f.emoji + ' ' + f.name + '</div>';
    html += '<div class="det-serving">' + f.serving + '</div>';

    // Serving adjuster
    html += '<div class="srv-row">';
    html += '<div><div class="srv-btn" id="srvMinus">-</div></div>';
    html += '<div><div class="srv-val" id="srvVal">' + m + 'x</div><div class="srv-label">porcion</div></div>';
    html += '<div><div class="srv-btn" id="srvPlus">+</div></div>';
    html += '</div>';

    // Quick mult buttons
    html += '<div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;">';
    [0.5, 1, 1.5, 2, 3].forEach(v => {
      const active = m === v ? 'background:var(--accent);color:#000;border-color:var(--accent);' : '';
      html += '<button class="srv-btn" style="width:44px;height:36px;border-radius:10px;font-size:14px;' + active + '" data-mult="' + v + '">' + v + 'x</button>';
    });
    html += '</div>';

    // Macros
    html += '<div class="macro-row">';
    html += '<div class="mc c"><div class="mv">' + cal + '</div><div class="ml">kcal</div></div>';
    html += '<div class="mc p"><div class="mv">' + p + 'g</div><div class="ml">proteina</div></div>';
    html += '<div class="mc cb"><div class="mv">' + c + 'g</div><div class="ml">carbos</div></div>';
    html += '</div>';

    // Detail list
    html += '<ul class="det-list">';
    html += '<li><span>Grasas</span><span class="dl">' + fat + 'g</span></li>';
    html += '<li><span>Fibra</span><span class="dl">' + fb + 'g</span></li>';
    html += '<li><span>Porcion base</span><span class="dl">' + f.serving + '</span></li>';
    html += '</ul>';

    // Save button
    html += '<button class="btn-main" id="btnSave">Guardar ' + cal + ' kcal</button>';
    html += '<button class="btn-sec" id="btnBackDet">Elegir otro alimento</button>';

    detWrap.innerHTML = html;

    // Handlers
    $('srvMinus').addEventListener('click', () => { if (currentMult > 0.5) { currentMult = Math.round((currentMult - 0.5) * 10) / 10; renderDetail(); } });
    $('srvPlus').addEventListener('click', () => { if (currentMult < 10) { currentMult = Math.round((currentMult + 0.5) * 10) / 10; renderDetail(); } });
    detWrap.querySelectorAll('[data-mult]').forEach(b => {
      b.addEventListener('click', () => { currentMult = parseFloat(b.dataset.mult); renderDetail(); });
    });
    $('btnSave').addEventListener('click', () => {
      saveToHistory(f, currentMult);
      show(screenCam);
      video.style.display = 'block';
      ph.style.display = 'none';
      xhair.classList.remove('off');
    });
    $('btnBackDet').addEventListener('click', () => show(screenPick));
  }

  /* ===== HISTORY ===== */
  function getHistory() {
    const today = new Date().toISOString().split('T')[0];
    return JSON.parse(localStorage.getItem('caloria_history') || '{}')[today] || [];
  }

  function saveToHistory(food, mult) {
    const today = new Date().toISOString().split('T')[0];
    const data = JSON.parse(localStorage.getItem('caloria_history') || '{}');
    if (!data[today]) data[today] = [];
    data[today].push({
      id: food.id,
      name: food.name,
      emoji: food.emoji,
      cal: Math.round(food.cal * mult),
      p: +(food.p * mult).toFixed(1),
      c: +(food.c * mult).toFixed(1),
      f: +(food.f * mult).toFixed(1),
      mult: mult,
      time: new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' })
    });
    localStorage.setItem('caloria_history', JSON.stringify(data));
    updateBadge();
  }

  function updateBadge() {
    const items = getHistory();
    const total = items.reduce((s, i) => s + i.cal, 0);
    if (items.length > 0) {
      badge.style.display = 'flex';
      badge.textContent = total + ' kcal hoy';
    } else {
      badge.style.display = 'none';
    }
  }

  function showHistory() {
    show(screenHist);
    const items = getHistory();
    let html = '';
    if (items.length === 0) {
      html = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg><p>Sin registros hoy</p></div>';
    } else {
      const total = items.reduce((s, i) => s + i.cal, 0);
      const totalP = items.reduce((s, i) => s + i.p, 0).toFixed(1);
      const totalC = items.reduce((s, i) => s + i.c, 0).toFixed(1);
      const totalF = items.reduce((s, i) => s + i.f, 0).toFixed(1);
      html += items.map(i => {
        return '<div class="hist-item"><div class="hi-left"><div class="hi-name">' + i.emoji + ' ' + i.name + (i.mult !== 1 ? ' (' + i.mult + 'x)' : '') + '</div><div class="hi-time">' + i.time + '</div></div><div class="hi-cal">' + i.cal + '</div></div>';
      }).join('');
      html += '<div class="hist-total"><div class="ht-label">Total</div><div class="ht-val">' + total + ' kcal</div></div>';
      html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;">';
      html += '<div class="mc p" style="padding:10px"><div class="mv" style="font-size:18px">' + totalP + 'g</div><div class="ml">proteina</div></div>';
      html += '<div class="mc cb" style="padding:10px"><div class="mv" style="font-size:18px">' + totalC + 'g</div><div class="ml">carbos</div></div>';
      html += '<div class="mc" style="padding:10px"><div class="mv" style="font-size:18px;color:var(--orange)">' + totalF + 'g</div><div class="ml">grasas</div></div>';
      html += '</div>';
    }
    histWrap.innerHTML = html;
  }

  /* ===== EVENT LISTENERS ===== */
  ph.addEventListener('click', initCam);
  btnSnap.addEventListener('click', () => {
    if (!stream) { initCam().then(() => setTimeout(snap, 500)); } else { snap(); }
  });
  btnFlip.addEventListener('click', () => { facingMode = facingMode === 'environment' ? 'user' : 'environment'; initCam(); });
  btnHist.addEventListener('click', showHistory);
  btnBack1.addEventListener('click', () => { show(screenCam); video.style.display = 'block'; ph.style.display = 'none'; });
  btnBack2.addEventListener('click', () => show(screenPick));
  btnBack3.addEventListener('click', () => show(screenCam));

  updateBadge();
})();
</script>
</body>
</html>
